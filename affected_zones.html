<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Global Flood Risk & Historical Disasters</title>
  
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />

  <style>
    body {
      background: radial-gradient(circle at top center, #1a1a2e 0%, #0d0d14 100%);
      color: #f1f1f1;
      font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      margin: 0;
      padding: 40px 20px;
      min-height: 100vh;
      box-sizing: border-box;
    }
    
    .container {
      max-width: 1400px; 
      margin: 0 auto;
      position: relative;
    }
    
    .back-btn {
      position: absolute;
      top: 0;
      left: 0;
      padding: 10px 20px;
      border-radius: 8px;
      background: rgba(30, 30, 40, 0.7);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      color: #e0e0e0;
      text-decoration: none;
      font-size: 0.95rem;
      font-weight: 600;
      display: inline-flex;
      align-items: center;
      transition: all 0.3s ease;
      z-index: 1000;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
    }
    
    .back-btn:hover {
      background: rgba(255, 77, 77, 0.15);
      color: #ff4d4d;
      border-color: rgba(255, 77, 77, 0.4);
      transform: translateX(-3px);
    }
    
    h1 {
      font-size: 3rem;
      margin: 20px 0 10px 0;
      background: linear-gradient(135deg, #ffffff 0%, #ff4d4d 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      text-align: center;
      letter-spacing: -0.5px;
    }
    
    p.intro-text {
      font-size: 1.15rem;
      line-height: 1.6;
      color: #a0a0b0;
      text-align: center;
      max-width: 850px;
      margin: 0 auto 30px auto;
    }
    
    .map-wrapper {
      position: relative;
      width: 100%;
      height: 75vh;
      min-height: 600px;
      border-radius: 16px;
      box-shadow: 0 12px 40px rgba(0, 0, 0, 0.6), 0 0 20px rgba(255, 77, 77, 0.15);
      border: 1px solid rgba(255, 77, 77, 0.3);
      overflow: hidden;
      background: #0d0d14;
    }

    #flood-map {
      width: 100%;
      height: 100%;
      background: #0d0d14;
    }

    .map-legend {
      background: rgba(15, 15, 20, 0.85);
      padding: 15px 20px;
      border-radius: 12px;
      border: 1px solid rgba(255, 77, 77, 0.3);
      color: #e0e0e0;
      font-size: 14px;
      line-height: 1.6;
      backdrop-filter: blur(10px);
      box-shadow: 0 4px 15px rgba(0,0,0,0.5);
    }

    .leaflet-popup-content-wrapper {
      background: rgba(20, 20, 30, 0.95);
      color: #fff;
      border: 1px solid rgba(255, 77, 77, 0.5);
      border-radius: 8px;
      backdrop-filter: blur(8px);
    }
    .leaflet-popup-tip {
      background: rgba(20, 20, 30, 0.95);
      border: 1px solid rgba(255, 77, 77, 0.5);
    }
    .leaflet-container a.leaflet-popup-close-button {
      color: #ff4d4d;
    }

    .popup-title {
      margin: 0 0 8px 0;
      color: #fff;
      font-size: 16px;
      border-bottom: 1px solid rgba(255,255,255,0.2);
      padding-bottom: 5px;
    }
    .popup-year {
      color: #ffaa33;
      font-weight: bold;
      font-size: 13px;
      text-transform: uppercase;
      letter-spacing: 1px;
      display: block;
      margin-bottom: 8px;
    }
    .popup-desc {
      font-size: 13px;
      line-height: 1.5;
      color: #cccccc;
      margin: 0;
    }

    .layer-controls {
      position: absolute;
      top: 20px;
      right: 20px;
      z-index: 1000;
      display: flex;
      gap: 1px;
      background: rgba(20, 20, 30, 0.8);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 8px;
      overflow: hidden;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.5);
    }

    .layer-btn {
      background: transparent;
      color: #a0a0b0;
      border: none;
      padding: 12px 20px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s ease;
      outline: none;
    }

    .layer-btn:hover {
      background: rgba(255, 255, 255, 0.05);
    }

    .layer-btn.active {
      color: #fff;
    }

    .layer-btn#btn-danger.active {
      background: rgba(255, 77, 77, 0.2);
      border-bottom: 3px solid #ff4d4d;
    }

    .layer-btn#btn-history.active {
      background: rgba(255, 140, 0, 0.2);
      border-bottom: 3px solid #ff8c00;
    }

    .legend-item {
      transition: opacity 0.3s ease;
    }
    .legend-item.dimmed {
      opacity: 0.3;
    }
  </style>
</head>

    <h1>Global Flood Risk & Echoes of the Deep</h1>

    <div class="map-wrapper">

        <button id="btn-danger" class="layer-btn active">Danger Zones</button>
        <button id="btn-history" class="layer-btn active">Historical Events</button>
      </div>

      <div id="flood-map"></div>
    </div>
  </div>

      maxBoundsViscosity: 1.0, 
      minZoom: 2,              
      worldCopyJump: false,
      zoomControl: false 
    }).setView([20, 0], 2);

    L.control.zoom({ position: 'topleft' }).addTo(map);

    L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_nolabels/{z}/{x}/{y}{r}.png', {
      attribution: '&copy; CARTO',
      subdomains: 'abcd',
      maxZoom: 10,
      noWrap: true 
    }).addTo(map);

    L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_only_labels/{z}/{x}/{y}{r}.png', {
      pane: 'shadowPane', 
      subdomains: 'abcd',
      maxZoom: 10,
      noWrap: true
    }).addTo(map);

    const dangerGroup = L.layerGroup().addTo(map);
    const historyGroup = L.layerGroup().addTo(map);

      { lat: 29.7, lon: -95.3, radius: 100000, name: "Hurricane Harvey", year: "2017", desc: "Dropped an unprecedented 60 inches of rain on Houston, Texas, causing $125 billion in damage." },
      { lat: 40.7, lon: -74.0, radius: 100000, name: "Hurricane Sandy", year: "2012", desc: "An epic storm surge flooded the New York City subway system and devastated coastal communities." },
      { lat: 39.7, lon: -84.1, radius: 50000, name: "Great Dayton Flood", year: "1913", desc: "Ohio's greatest natural disaster, causing 360 deaths and immense destruction." },
      { lat: 44.0, lon: -103.2, radius: 40000, name: "Black Hills Flood", year: "1972", desc: "A devastating flash flood in Rapid City, South Dakota that claimed 238 lives." },
      { lat: 40.4, lon: -105.2, radius: 30000, name: "Big Thompson Canyon Flood", year: "1976", desc: "A violent, sudden flash flood in a Colorado canyon that killed 144 people." },
      { lat: 29.9, lon: -90.0, radius: 100000, name: "Hurricane Betsy", year: "1965", desc: "Flooded large parts of New Orleans and became the first billion-dollar hurricane in US history." },
      { lat: 4.6, lon: -74.0, radius: 150000, name: "Colombia Floods", year: "2010", desc: "Unprecedented La Niña rains caused flooding and landslides that affected over 2 million people." },
      { lat: -30.0, lon: -51.2, radius: 250000, name: "Rio Grande do Sul Floods", year: "2024", desc: "Historic, catastrophic flooding that submerged major parts of southern Brazil, displacing millions." },
      { lat: -34.9, lon: -57.9, radius: 60000, name: "La Plata Flood", year: "2013", desc: "An extreme flash flood event in Argentina that claimed over 80 lives in a matter of hours." },

      { lat: 32.7, lon: 22.6, radius: 40000, name: "Derna Dam Collapses", year: "2023", desc: "Storm Daniel caused two aging dams to collapse in Libya, sending a wall of water that washed entire neighborhoods into the sea, killing over 4,000." },
      { lat: -19.8, lon: 34.8, radius: 150000, name: "Cyclone Idai", year: "2019", desc: "Created a massive 'inland ocean' in Mozambique, destroying the city of Beira and killing over 1,000 across Southern Africa." },
      { lat: -21.0, lon: 34.0, radius: 150000, name: "Mozambique Flood", year: "2000", desc: "A catastrophic disaster following Cyclone Leon-Eline that devastated southern Africa." },
      { lat: 8.0, lon: 6.0, radius: 250000, name: "Nigeria Floods", year: "2022", desc: "The worst flooding in a decade, killing over 600 people and displacing 1.4 million." },
      { lat: 2.0, lon: 45.0, radius: 250000, name: "Horn of Africa Floods", year: "2006", desc: "Severe unseasonal rains submerged hundreds of villages in Somalia, Kenya, and Ethiopia." },
      { lat: 15.5, lon: 32.5, radius: 100000, name: "Khartoum Floods", year: "1988", desc: "Massive floods in Sudan that left over 1 million people entirely homeless." },

      { lat: -27.5, lon: 152.0, radius: 300000, name: "Queensland Floods", year: "2010-2011", desc: "Submerged an area of Australia the size of France and Germany combined, crippling the city of Brisbane." },

    historicalFloods.forEach(event => {
      const circle = L.circle([event.lat, event.lon], { color: '#ff8c00', weight: 2, fillColor: '#ff4500', fillOpacity: 0.5, radius: event.radius });
      circle.bindPopup(`<div style="min-width: 200px;"><h4 class="popup-title">${event.name}</h4><span class="popup-year">Event Year: ${event.year}</span><p class="popup-desc">${event.desc}</p></div>`);
      circle.on('mouseover', function () { this.setStyle({ fillOpacity: 0.8, weight: 3, color: '#ffffff' }); });
      circle.on('mouseout', function () { this.setStyle({ fillOpacity: 0.5, weight: 2, color: '#ff8c00' }); });
      historyGroup.addLayer(circle);
    });

    const btnDanger = document.getElementById('btn-danger');
    const btnHistory = document.getElementById('btn-history');

    btnDanger.addEventListener('click', function() {
      this.classList.toggle('active');
      const legendDanger = document.getElementById('legend-danger');
      if (map.hasLayer(dangerGroup)) {
        map.removeLayer(dangerGroup);
        if(legendDanger) legendDanger.classList.add('dimmed');
      } else {
        map.addLayer(dangerGroup);
        if(legendDanger) legendDanger.classList.remove('dimmed');
      }
    });

    btnHistory.addEventListener('click', function() {
      this.classList.toggle('active');
      const legendHistory = document.getElementById('legend-history');
      if (map.hasLayer(historyGroup)) {
        map.removeLayer(historyGroup);
        if(legendHistory) legendHistory.classList.add('dimmed');
      } else {
        map.addLayer(historyGroup);
        if(legendHistory) legendHistory.classList.remove('dimmed');
      }
    });

    const legend = L.control({position: 'bottomright'});
    legend.onAdd = function () {
      const div = L.DomUtil.create('div', 'map-legend');
      div.innerHTML = `
        <strong style="font-size: 1.1em; border-bottom: 1px solid rgba(255,255,255,0.2); padding-bottom: 5px; display: block; margin-bottom: 10px;">Dashboard Key</strong>
        
        <div id="legend-danger" class="legend-item" style="display: flex; align-items: center; margin-bottom: 8px;">
          <div style="width: 16px; height: 16px; background: rgba(255, 42, 42, 0.4); border: 1.5px solid #ff4d4d; margin-right: 8px; border-radius: 2px;"></div>
          <span>315 Global Flood Danger Zones</span>
        </div>
        
        <div id="legend-history" class="legend-item" style="display: flex; align-items: center; margin-bottom: 4px;">
          <div style="width: 16px; height: 16px; background: rgba(255, 69, 0, 0.5); border: 2px solid #ff8c00; margin-right: 8px; border-radius: 50%;"></div>
          <span>63 Historical Catastrophe Epicenters</span>
        </div>

        <em style="font-size:12px; color:#a0a0b0; display: block; margin-top: 8px;">Hover & click any zone for analytics</em>
      `;
      return div;
    };
    legend.addTo(map);

  </script>
</body>
