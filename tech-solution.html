<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title></title>
  <style>
    body {
      background: radial-gradient(circle at top left, #1a1a2e, #121212);
      background-color: #121212;
      color: #f1f1f1;
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 60px;
      min-height: 100vh;
      box-sizing: border-box;
    }
    .container {
      max-width: 800px;
      margin: 0 auto;
    }
   .back-btn {
      
      position: absolute;
      top: 40px;
      left: 40px;
      
      padding: 12px 24px;
      border-radius: 50px;
      
      background-color: rgba(30, 30, 30, 0.6);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 0.05);
      
      color: #e0e0e0;
      text-decoration: none;
      font-size: 1rem;
      font-weight: bold;
      display: flex;
      align-items: center;
      transition: all 0.3s ease;
    }

    .back-btn:hover {
      background-color: rgba(42, 42, 42, 0.9);
      color: #4da6ff;
      border-color: #4da6ff;
      transform: translateX(-5px); 
      box-shadow: 0 5px 15px rgba(0,0,0,0.4);
    }
    h1 {
      font-size: 3.5rem;
      margin-top: 0;
      background: -webkit-linear-gradient(#ffffff, #4da6ff);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    p {
      font-size: 1.2rem;
      line-height: 1.6;
      color: #cccccc;
    }
  </style>
</head>
<body>
  <div class="container">
    <a href="Main.html" class="back-btn">← Back to Home</a>
    <h1></h1>
</body>
</html>
