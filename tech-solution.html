<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Real-Time Flood Forecasting System</title>
  
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg-dark: #0a0a0f;
      --primary-blue: #4da6ff;
      --primary-cyan: #00e5ff;
      --primary-red: #ff4d4d;
      --primary-orange: #ff8c00;
      --text-main: #f1f1f1;
      --text-muted: #9ba1a6;
      --card-bg: rgba(255, 255, 255, 0.03);
      --card-border: rgba(255, 255, 255, 0.08);
    }

    body {
      background-color: var(--bg-dark);
      background-image: 
        radial-gradient(circle at 15% 50%, rgba(77, 166, 255, 0.08), transparent 25%),
        radial-gradient(circle at 85% 30%, rgba(0, 229, 255, 0.05), transparent 25%);
      color: var(--text-main);
      font-family: 'Outfit', sans-serif;
      margin: 0;
      padding: 40px 20px;
      min-height: 100vh;
      box-sizing: border-box;
    }

    .container {
      max-width: 1000px;
      margin: 0 auto;
      position: relative;
    }

    .back-btn {
      position: absolute;
      top: 0;
      left: 0;
      padding: 10px 24px;
      border-radius: 50px;
      background: var(--card-bg);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid var(--card-border);
      color: var(--text-muted);
      text-decoration: none;
      font-size: 0.95rem;
      font-weight: 500;
      display: flex;
      align-items: center;
      transition: all 0.3s ease;
      z-index: 1000;
    }

    .back-btn:hover {
      background: rgba(77, 166, 255, 0.1);
      color: var(--primary-blue);
      border-color: rgba(77, 166, 255, 0.4);
      transform: translateX(-5px);
    }

    .header {
      text-align: center;
      margin-bottom: 40px;
      padding-top: 60px;
    }

    h1 {
      font-size: clamp(2.5rem, 4vw, 3.5rem);
      margin: 0 0 15px 0;
      font-weight: 700;
      letter-spacing: -1px;
    }

    .gradient-text {
      background: linear-gradient(135deg, #ffffff 0%, var(--primary-blue) 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    p.subtitle {
      font-size: 1.1rem;
      line-height: 1.6;
      color: var(--text-muted);
      font-weight: 300;
      max-width: 800px;
      margin: 0 auto;
    }

    .dashboard {
      background: var(--card-bg);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid var(--card-border);
      border-radius: 24px;
      box-shadow: 0 30px 60px rgba(0, 0, 0, 0.4), inset 0 1px 0 rgba(255,255,255,0.05);
      padding: 30px;
      display: flex;
      flex-direction: column;
      gap: 25px;
    }

    .system-controls {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-bottom: 25px;
      border-bottom: 1px solid var(--card-border);
      flex-wrap: wrap;
      gap: 20px;
    }

    .system-status h3 {
      margin: 0 0 5px 0;
      font-size: 1.3rem;
      font-weight: 600;
      color: var(--text-main);
    }

    .system-status p {
      margin: 0;
      font-size: 0.95rem;
      color: var(--text-muted);
      font-weight: 300;
    }

    .btn-group {
      display: flex;
      gap: 15px;
    }

    .btn {
      padding: 12px 28px;
      font-size: 0.95rem;
      font-weight: 600;
      font-family: inherit;
      border: none;
      border-radius: 12px;
      cursor: pointer;
      transition: all 0.3s ease;
      letter-spacing: 0.5px;
    }

    .btn-primary {
      background: linear-gradient(135deg, var(--primary-cyan) 0%, var(--primary-blue) 100%);
      color: #000;
      box-shadow: 0 4px 15px rgba(0, 229, 255, 0.2);
    }

    .btn-primary:hover {
      box-shadow: 0 8px 25px rgba(0, 229, 255, 0.4);
      transform: translateY(-2px);
      filter: brightness(1.1);
    }

    .btn-danger {
      background-color: rgba(255, 77, 77, 0.05);
      color: var(--primary-red);
      border: 1px solid rgba(255, 77, 77, 0.2);
    }

    .btn-danger:hover {
      background-color: rgba(255, 77, 77, 0.15);
      border-color: var(--primary-red);
      box-shadow: 0 4px 15px rgba(255, 77, 77, 0.2);
      transform: translateY(-2px);
    }

    .terminal-window {
      background-color: #050508;
      border: 1px solid var(--card-border);
      border-radius: 16px;
      padding: 24px;
      height: 450px;
      overflow-y: auto;
      font-family: 'Courier New', Courier, monospace;
      font-size: 0.95rem;
      box-shadow: inset 0 15px 30px rgba(0,0,0,0.6);
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .terminal-window::-webkit-scrollbar {
      width: 8px;
    }
    .terminal-window::-webkit-scrollbar-track {
      background: rgba(0, 0, 0, 0.2);
      border-radius: 4px;
    }
    .terminal-window::-webkit-scrollbar-thumb {
      background: rgba(255, 255, 255, 0.1);
      border-radius: 4px;
    }
    .terminal-window::-webkit-scrollbar-thumb:hover {
      background: rgba(255, 255, 255, 0.2);
    }

    .log-entry {
      border-bottom: 1px solid rgba(255,255,255,0.03);
      padding-bottom: 12px;
      line-height: 1.6;
    }
    .log-entry:last-child {
      border-bottom: none;
    }

    .text-normal { color: var(--text-main); }
    .text-highlight { color: var(--primary-cyan); font-weight: bold; }
    .text-warning { color: var(--primary-orange); font-weight: bold; }
    .text-critical { color: var(--primary-red); font-weight: bold; }
    .text-time { color: var(--text-muted); font-size: 0.85rem; margin-right: 12px;}
    .text-location { color: var(--primary-blue); font-weight: bold; }

  </style>
</head>
<body>
  <div class="container">
    <a href="Main.html" class="back-btn">← Back</a>
    
    <div class="header">
      <h1>Automated <span class="gradient-text">Forecasting</span></h1>
      <p class="subtitle">This module simulates how automated monitoring systems track rapid surges in water levels, detecting flash floods before absolute thresholds are crossed.</p>
    </div>

    <div class="dashboard">
      <div class="system-controls">
        <div class="system-status">
          <h3>Telemetry Node Status</h3>
          <p id="status-text">Global network idle. Awaiting initialization.</p>
        </div>
        <div class="btn-group">
          <button class="btn btn-primary" id="startBtn">Initialize System</button>
          <button class="btn btn-danger" id="stopBtn" style="display: none;">Halt Sweep</button>
        </div>
      </div>

      <div class="terminal-window" id="terminal">
        <div class="log-entry text-normal"><span class="text-time">[SYS]</span> Awaiting system initialization...</div>
      </div>
    </div>
  </div>

  <script>
    const surgeThreshold = 0.9; 
    
    const monitoringStations = [
      { id: "S-01", body: "Missouri River", location: "Omaha, United States", level: 2.1, maxCapacity: 6.5, offline: false },
      { id: "S-02", body: "Mississippi River", location: "St. Louis, United States", level: 2.8, maxCapacity: 8.0, offline: false },
      { id: "S-03", body: "Mississippi River", location: "Memphis, United States", level: 3.2, maxCapacity: 10.0, offline: false },
      { id: "S-04", body: "Lake Pontchartrain", location: "New Orleans, United States", level: 1.9, maxCapacity: 3.5, offline: false },
      { id: "S-05", body: "Rhine River", location: "Cologne, Germany", level: 2.5, maxCapacity: 7.2, offline: false }
    ];

    let readingCount = 0;
    let monitorInterval;
    let simulatedDate = new Date();

    const terminal = document.getElementById('terminal');
    const startBtn = document.getElementById('startBtn');
    const stopBtn = document.getElementById('stopBtn');
    const statusText = document.getElementById('status-text');

    function advanceSimulatedTime() {
      const hoursToAdd = Math.floor(Math.random() * 13) + 2; 
      const minsToAdd = Math.floor(Math.random() * 60);
      
      simulatedDate.setHours(simulatedDate.getHours() + hoursToAdd);
      simulatedDate.setMinutes(simulatedDate.getMinutes() + minsToAdd);

      return simulatedDate.toLocaleString('en-US', { 
        month: 'short', 
        day: '2-digit', 
        hour: '2-digit', 
        minute: '2-digit',
        hour12: false 
      });
    }

    function appendLog(message, isHTML = false) {
      const logDiv = document.createElement('div');
      logDiv.className = 'log-entry';
      if (isHTML) {
        logDiv.innerHTML = message;
      } else {
        logDiv.innerText = message;
      }
      terminal.appendChild(logDiv);
      terminal.scrollTop = terminal.scrollHeight;
    }

    function runSimulationStep() {
      let station = null;
      let attempts = 0;
      
      while (attempts < monitoringStations.length) {
        let candidate = monitoringStations[readingCount % monitoringStations.length];
        readingCount++;
        attempts++;
        if (!candidate.offline) {
          station = candidate;
          break;
        }
      }

      if (!station) {
        stopSystem();
        let exactTime = advanceSimulatedTime();
        statusText.innerText = "System Failure: All nodes offline.";
        appendLog(`<span class="text-time">[${exactTime}]</span><span class="text-critical">SYSTEM FAILURE: All monitoring stations are submerged and offline. Halting.</span>`, true);
        return;
      }

      let previousLevel = station.level;
      let fluctuation = 0;
      let eventRoll = Math.random();

      if (eventRoll < 0.04) {
        fluctuation = (Math.random() * 2.0) + 1.0; 
      } else if (eventRoll < 0.25) {
        fluctuation = (Math.random() * 1.1) + 0.4;
      } else if (eventRoll < 0.35) {
        fluctuation = -(Math.random() * 0.6) - 0.2;
      } else {
        fluctuation = (Math.random() * 1.2) - 0.4; 
      }

      if (station.level > station.maxCapacity * 0.95) {
        fluctuation -= 0.4; 
      } else if (station.level < 0.5) {
        fluctuation += 0.5; 
      }

      station.level += fluctuation;
      
      if (station.level < 0.0) station.level = 0.0;
      
      let deltaLevel = station.level - previousLevel;
      let deltaStr = (deltaLevel > 0 ? "+" : "") + deltaLevel.toFixed(2);
      let exactTime = advanceSimulatedTime();
      
      let topRow = `<span class="text-time">[${exactTime}]</span><span class="text-location">[${station.id}] ${station.body}, ${station.location}</span><br><span class="text-normal">📊 Level: <span class="text-highlight">${station.level.toFixed(2)}m</span> / <span class="text-highlight">${station.maxCapacity.toFixed(1)}m Limit</span> | Change: <span class="text-highlight">${deltaStr}m</span></span>`;
      let bottomRow = '';

      let alerts = [];

      if (deltaLevel >= surgeThreshold) {
        alerts.push(`<span class="text-warning">⚠️ FLASH FLOOD WARNING: Rapid surge (${deltaStr}m) detected!</span>`);
      }
      
      if (station.level >= station.maxCapacity) {
        alerts.push(`<span class="text-critical">🚨 CRITICAL: Capacity of ${station.maxCapacity.toFixed(1)}m exceeded. Deploying local floodgates!</span>`);
      }

      if (alerts.length > 0) {
        bottomRow = alerts.join('<br>');
      } else {
        bottomRow = `<span class="text-highlight">✅ Status Normal. Monitoring steady...</span>`;
      }

      appendLog(`${topRow}<br>${bottomRow}`, true);

      if (station.level > station.maxCapacity + 2.0) {
        station.offline = true;
        let crashTime = advanceSimulatedTime();
        appendLog(`<span class="text-time">[${crashTime}]</span><span class="text-critical">FATAL ERROR: Sensor ${station.id} offline. Submerged underwater. Routing to remaining nodes...</span>`, true);
      }
    }

    function startSystem() {
      terminal.innerHTML = ''; 
      readingCount = 0;
      simulatedDate = new Date(); 
      statusText.innerHTML = "Scanning telemetry nodes...";
      
      monitoringStations.forEach(s => {
        s.level = (Math.random() * (s.maxCapacity * 0.4)) + 1.0; 
        s.offline = false;
      });
      
      startBtn.style.display = 'none';
      stopBtn.style.display = 'inline-block';
      
      let exactTime = simulatedDate.toLocaleString('en-US', { month: 'short', day: '2-digit', hour: '2-digit', minute: '2-digit', hour12: false });
      appendLog(`<span class="text-time">[${exactTime}]</span><span class="text-highlight">Starting Global Flood Network Sweep...</span>`, true);
      appendLog(`<span class="text-time">[${exactTime}]</span><span class="text-normal">Connecting to ${monitoringStations.length} regional telemetry nodes...</span>`, true);
      
      monitorInterval = setInterval(runSimulationStep, 2000);
    }

    function stopSystem() {
      clearInterval(monitorInterval);
      startBtn.style.display = 'inline-block';
      startBtn.innerText = 'Restart Monitoring';
      stopBtn.style.display = 'none';
      statusText.innerText = "System halted by user.";
      
      let exactTime = advanceSimulatedTime();
      appendLog(`<span class="text-time">[${exactTime}]</span><span class="text-normal">System paused by user.</span>`, true);
    }

    startBtn.addEventListener('click', startSystem);
    stopBtn.addEventListener('click', stopSystem);
  </script>
</body>
</html>
